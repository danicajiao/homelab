# ClusterIP Service for cove-media.
#
# cove-media is not exposed publicly — cove-api routes upload and
# image-URL requests to it in-cluster. The /i/* imgproxy proxy path
# (#244) routes to imgproxy directly, not through cove-media.
apiVersion: v1
kind: Service
metadata:
    name: cove-media
spec:
    selector:
        app: cove-media
    ports:
        - port: 8080
          targetPort: 8080
    type: ClusterIP
