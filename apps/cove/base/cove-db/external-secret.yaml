# Syncs the Garage `postgres-backups` bucket credentials from GCP Secret
# Manager into a Kubernetes Secret the Barman Cloud Plugin ObjectStore consumes
# (objectstore.yaml references `cove-db-backup-creds` for its S3 credentials).
#
# ONE-TIME SETUP — run once before backups will work:
#
#   1. Create a Garage access key scoped to the `postgres-backups` bucket
#      (the bucket already exists — created in danicajiao/cove#213).
#
#   2. Store the key in GCP Secret Manager (project cove-6a685):
#
#        gcloud secrets create garage-postgres-backups-access-key \
#          --project=cove-6a685 --replication-policy=automatic
#        printf '%s' "<ACCESS_KEY_ID>" | gcloud secrets versions add \
#          garage-postgres-backups-access-key --project=cove-6a685 --data-file=-
#
#        gcloud secrets create garage-postgres-backups-secret-key \
#          --project=cove-6a685 --replication-policy=automatic
#        printf '%s' "<SECRET_ACCESS_KEY>" | gcloud secrets versions add \
#          garage-postgres-backups-secret-key --project=cove-6a685 --data-file=-
#
# Until the GCP secrets exist this ExternalSecret stays in SecretSyncedError
# and backups won't run — the cove-db cluster itself is unaffected. Once they
# exist, ESO syncs within the refreshInterval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: cove-db-backup-creds
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: ClusterSecretStore
        name: gcp-cove
    target:
        name: cove-db-backup-creds
        creationPolicy: Owner
        # Inject a static `region` key alongside the fetched access/secret keys.
        # Garage validates the SigV4 region scope (it must be `garage`, not the
        # boto3 default of us-east-1), and the ObjectStore reads the region from
        # this secret (s3Credentials.region). mergePolicy: Merge keeps the
        # provider-fetched data keys and adds this rendered one.
        template:
            engineVersion: v2
            mergePolicy: Merge
            data:
                region: garage
    data:
        - secretKey: ACCESS_KEY_ID
          remoteRef:
              key: garage-postgres-backups-access-key
        - secretKey: ACCESS_SECRET_KEY
          remoteRef:
              key: garage-postgres-backups-secret-key
