# Barman Cloud Plugin ObjectStore — where cove-db's backups + WAL land.
#
# Targets the Garage `postgres-backups` bucket over the in-cluster S3 endpoint.
# The per-cluster backup identity (`serverName`) is NOT set here — the plugin
# forbids it on the ObjectStore and requires it as a plugin parameter on the
# Cluster instead (so one ObjectStore can serve multiple clusters). It's set
# per env in the overlays (cove-db-staging / cove-db-prod); backups land under
# `<destinationPath>/<serverName>/`.
#
# Credentials come from the `cove-db-backup-creds` Secret, synced by ESO from
# GCP Secret Manager (see external-secret.yaml).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
    name: cove-db-backup
spec:
    # Keep ~6 monthly base backups (+ their WAL). Retention must comfortably
    # exceed the monthly base-backup interval so a base backup is never expired
    # before its successor exists.
    retentionPolicy: "6m"
    configuration:
        destinationPath: s3://postgres-backups
        endpointURL: http://garage.garage.svc.cluster.local:3900
        s3Credentials:
            accessKeyId:
                name: cove-db-backup-creds
                key: ACCESS_KEY_ID
            secretAccessKey:
                name: cove-db-backup-creds
                key: ACCESS_SECRET_KEY
        wal:
            compression: gzip
        data:
            compression: gzip
