# imgproxy signing keys — IMGPROXY_KEY and IMGPROXY_SALT.
#
# These 32-byte hex values are used by imgproxy to verify that incoming
# URL signatures were generated by the server (cove-product / cove-image).
# Any URL with an invalid signature returns 403 — prevents clients from
# requesting arbitrary transforms.
#
# ONE-TIME SETUP — run once before this manifest is applied:
#
#   openssl rand -hex 32  # KEY
#   openssl rand -hex 32  # SALT
#
#   printf '%s' "<key>"  | gcloud secrets create imgproxy-key \
#     --data-file=- --project=cove-6a685
#
#   printf '%s' "<salt>" | gcloud secrets create imgproxy-salt \
#     --data-file=- --project=cove-6a685
#
# IMPORTANT: use printf '%s' not echo — echo appends a trailing newline (\n)
# which ends up in the K8s Secret and causes the AWS SDK to reject the
# Authorization header with "invalid header field value". If a secret was
# created with echo, re-add a clean version:
#
#   gcloud secrets versions access latest --secret=imgproxy-key \
#     --project=cove-6a685 | tr -d '\n' | \
#     gcloud secrets versions add imgproxy-key --data-file=- --project=cove-6a685
#
# Until both GCP secrets exist, this ExternalSecret will be in
# SecretSyncedError and the Deployment pods will be stuck in Pending.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: imgproxy-signing-keys
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: ClusterSecretStore
        name: gcp-cove
    target:
        name: imgproxy-signing-keys
        creationPolicy: Owner
    data:
        - secretKey: IMGPROXY_KEY
          remoteRef:
              key: imgproxy-key
        - secretKey: IMGPROXY_SALT
          remoteRef:
              key: imgproxy-salt
---
# Garage read credentials for the cove-media bucket.
#
# imgproxy fetches image originals directly from Garage over the in-cluster
# S3 API. These are the same credentials used by cove-image for uploads —
# synced here into the cove namespace so imgproxy's pod can consume them.
#
# IMPORTANT: ensure garage-cove-media-access-key and
# garage-cove-media-secret-key in GCP Secret Manager have no trailing
# newline — same gotcha as the signing keys above. Verify with:
#   gcloud secrets versions access latest --secret=garage-cove-media-access-key \
#     --project=cove-6a685 | xxd | tail -1
# The last byte should NOT be 0a. If it is, re-add using tr -d '\n' as above.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: imgproxy-garage-creds
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: ClusterSecretStore
        name: gcp-cove
    target:
        name: imgproxy-garage-creds
        creationPolicy: Owner
    data:
        - secretKey: AWS_ACCESS_KEY_ID
          remoteRef:
              key: garage-cove-media-access-key
        - secretKey: AWS_SECRET_ACCESS_KEY
          remoteRef:
              key: garage-cove-media-secret-key
