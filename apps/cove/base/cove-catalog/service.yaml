# ClusterIP Service for cove-catalog.
#
# cove-catalog is not exposed publicly — cove-api routes discovery,
# category and item requests to it in-cluster.
apiVersion: v1
kind: Service
metadata:
    name: cove-catalog
spec:
    selector:
        app: cove-catalog
    ports:
        - port: 8080
          targetPort: 8080
    type: ClusterIP
