apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — every base resource is rewritten into the cove-staging
# namespace. Env-specific patches (image tags, replica counts, resource
# limits) belong here too as the app grows.

namespace: cove-staging

resources:
    - ../../base

# Pin services to the most recent successful CI build promoted to staging.
# All five services share one SHA.
# cove-media, cove-catalog and cove-directory replaced cove-image and cove-item
# (danicajiao/cove#413, #414, #416). The cutover (danicajiao/cove#400) pinned
# both overlays to the integration-branch build; CI's bump job rewrites every
# newTag line after that.
# Update every tag each time a new build is promoted to staging.
images:
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-api
      newTag: sha-0a1782211d1a91362c25f307c20d827a78ec0659
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-media
      newTag: sha-0a1782211d1a91362c25f307c20d827a78ec0659
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-catalog
      newTag: sha-0a1782211d1a91362c25f307c20d827a78ec0659
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-directory
      newTag: sha-0a1782211d1a91362c25f307c20d827a78ec0659
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-user
      newTag: sha-0a1782211d1a91362c25f307c20d827a78ec0659

# Per-env backup serverName (a Barman Cloud Plugin parameter on the Cluster) so
# staging/prod don't collide under the one `postgres-backups` Garage bucket
# (backups live at <destinationPath>/<serverName>/).
patches:
    - target:
          kind: Cluster
          name: cove-db
      patch: |-
          - op: replace
            path: /spec/plugins/0/parameters/serverName
            value: cove-db-staging
