apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging overlay — every base resource is rewritten into the cove-staging
# namespace. Env-specific patches (image tags, replica counts, resource
# limits) belong here too as the app grows.

namespace: cove-staging

resources:
    - ../../base

# Pin services to the most recent successful CI build. Both cove-api and
# cove-image share the same SHA — they were built together from the Phase 2
# integration branch via workflow_dispatch (danicajiao/cove#241).
# Update this tag each time a new build is promoted to staging.
images:
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-api
      newTag: sha-448d6d295133e9ca56ad074ac153f4ed87489edd
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-image
      newTag: sha-448d6d295133e9ca56ad074ac153f4ed87489edd
