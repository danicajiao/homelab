apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay — every base resource is rewritten into the cove-prod
# namespace. Env-specific patches (image tags, replica counts, resource
# limits) belong here too as the app grows.

namespace: cove-prod

resources:
    - ../../base

# Prod tag is promoted manually from staging after validation.
# Keep in sync with the staging overlay until a formal promotion workflow
# exists.
# cove-media, cove-catalog and cove-directory replaced cove-image and cove-item
# (danicajiao/cove#413, #414, #416). Their sha-placeholder tags are set to the
# first integration-branch build during the cutover (danicajiao/cove#400);
# CI's bump job rewrites every newTag line after that.
images:
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-api
      newTag: sha-d453f0c827820d771578f26ba4d105e75d69e8e6
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-media
      newTag: sha-placeholder
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-catalog
      newTag: sha-placeholder
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-directory
      newTag: sha-placeholder
    - name: us-central1-docker.pkg.dev/cove-6a685/services/cove-user
      newTag: sha-d453f0c827820d771578f26ba4d105e75d69e8e6

# Override IMGPROXY_BASE_URL for prod — base defaults to the staging URL.
patches:
    - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
              name: cove-media
          spec:
              template:
                  spec:
                      containers:
                          - name: cove-media
                            env:
                                - name: IMGPROXY_BASE_URL
                                  value: "https://api.coveapp.dev/i"
      target:
          kind: Deployment
          name: cove-media
    - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
              name: cove-catalog
          spec:
              template:
                  spec:
                      containers:
                          - name: cove-catalog
                            env:
                                - name: IMGPROXY_BASE_URL
                                  value: "https://api.coveapp.dev/i"
      target:
          kind: Deployment
          name: cove-catalog
    - patch: |-
          apiVersion: apps/v1
          kind: Deployment
          metadata:
              name: cove-directory
          spec:
              template:
                  spec:
                      containers:
                          - name: cove-directory
                            env:
                                - name: IMGPROXY_BASE_URL
                                  value: "https://api.coveapp.dev/i"
      target:
          kind: Deployment
          name: cove-directory
    # Per-env backup serverName (a Barman Cloud Plugin parameter on the Cluster)
    # so staging/prod don't collide under the one `postgres-backups` Garage
    # bucket (backups live at <destinationPath>/<serverName>/).
    - target:
          kind: Cluster
          name: cove-db
      patch: |-
          - op: replace
            path: /spec/plugins/0/parameters/serverName
            value: cove-db-prod
