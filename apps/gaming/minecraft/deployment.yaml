apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: gaming
spec:
  # Default off — only manual `kubectl scale` brings the server up. Argo CD
  # ignores `/spec/replicas` (see `argocd/minecraft.yaml` ignoreDifferences),
  # so live state persists across reconciles. The 0 here only takes effect on
  # fresh cluster bootstrap (Argo CD's first apply). Manual scale flow:
  #   kubectl scale deployment minecraft -n gaming --replicas=1   # start
  #   kubectl scale deployment minecraft -n gaming --replicas=0   # stop
  # Hard cap: never scale above 1 — concurrent writers corrupt the world.
  # Enforced at the API server by `replica-cap.yaml` (ValidatingAdmissionPolicy);
  # a `kubectl scale --replicas=2` will be rejected, not just discouraged.
  replicas: 0
  selector:
    matchLabels:
      app: minecraft
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      initContainers:
        # Split into two containers so each has its own /tmp — combining
        # aws-cli (apk, pulls Python) with the zip extraction exhausted /tmp
        # space and caused unzip to produce no output directory, making the
        # subsequent cp silently target / instead of the modpack directory.

        - name: world-backup
          # amazon/aws-cli ships with aws-cli pre-installed — no apk needed,
          # so this container's /tmp is free for the world tar.
          image: amazon/aws-cli:latest
          env:
            - name: MODPACK_VERSION
              value: "1.3.4"
            - name: S3_ENDPOINT
              value: "http://garage.garage.svc.cluster.local:3900"
            - name: S3_BUCKET
              value: "minecraft-backups"
            - name: AWS_DEFAULT_REGION
              value: "garage"
          envFrom:
            - secretRef:
                name: minecraft-backups-creds
          command:
            - sh
            - -c
            - |
              INSTALLED_VERSION=""
              if [ -f /data/.modpack-version ]; then
                INSTALLED_VERSION=$(cat /data/.modpack-version)
              fi

              if [ "$INSTALLED_VERSION" = "$MODPACK_VERSION" ]; then
                echo "Modpack $MODPACK_VERSION already installed, skipping backup."
                exit 0
              fi

              if [ -n "$INSTALLED_VERSION" ] && [ -d /data/world ]; then
                echo "Backing up world before update $INSTALLED_VERSION -> $MODPACK_VERSION..."
                TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                BACKUP_KEY="world-pre-update-${INSTALLED_VERSION}-to-${MODPACK_VERSION}-${TIMESTAMP}.tar.gz"
                tar -czf /tmp/world-backup.tar.gz -C /data world
                aws --endpoint-url "$S3_ENDPOINT" s3 cp \
                  /tmp/world-backup.tar.gz "s3://$S3_BUCKET/$BACKUP_KEY"
                rm /tmp/world-backup.tar.gz
                echo "World backed up to s3://$S3_BUCKET/$BACKUP_KEY"
              else
                echo "Fresh install — no world to back up."
              fi
          volumeMounts:
            - name: data
              mountPath: /data

        - name: modpack-installer
          # Uses amazon/aws-cli (consistent with world-backup) so unzip can
          # be installed via yum without consuming /tmp space via apk+Python.
          image: amazon/aws-cli:latest
          env:
            # To upgrade the modpack:
            #   1. Upload the new zip to Garage:
            #        aws --endpoint-url http://garage.garage.svc.cluster.local:3900 s3 cp \
            #          <zip> s3://minecraft-backups/modpacks/Homestead<VERSION>_server_pack.zip
            #   2. Update MODPACK_VERSION here and in world-backup above, then open a PR.
            - name: MODPACK_VERSION
              value: "1.3.4"
            - name: S3_ENDPOINT
              value: "http://garage.garage.svc.cluster.local:3900"
            - name: S3_BUCKET
              value: "minecraft-backups"
            - name: AWS_DEFAULT_REGION
              value: "garage"
          envFrom:
            - secretRef:
                name: minecraft-backups-creds
          command:
            - sh
            - -c
            - |
              set -e

              INSTALLED_VERSION=""
              if [ -f /data/.modpack-version ]; then
                INSTALLED_VERSION=$(cat /data/.modpack-version)
              fi

              if [ "$INSTALLED_VERSION" = "$MODPACK_VERSION" ]; then
                echo "Modpack $MODPACK_VERSION already installed, skipping."
                exit 0
              fi

              yum install -y unzip -q

              echo "Downloading modpack $MODPACK_VERSION from Garage..."
              aws --endpoint-url "$S3_ENDPOINT" s3 cp \
                "s3://$S3_BUCKET/modpacks/Homestead${MODPACK_VERSION}_server_pack.zip" \
                /tmp/modpack.zip

              mkdir -p /tmp/modpack
              unzip -q /tmp/modpack.zip -d /tmp/modpack

              # Detect the top-level directory the zip extracted into.
              EXTRACTED_DIR=$(find /tmp/modpack -maxdepth 1 -mindepth 1 -type d | head -1)
              if [ -z "$EXTRACTED_DIR" ]; then
                echo "ERROR: unzip produced no directory in /tmp/modpack — extraction likely failed."
                ls -la /tmp/modpack
                exit 1
              fi
              echo "Extracted to: $EXTRACTED_DIR"

              if [ -z "$INSTALLED_VERSION" ]; then
                echo "Fresh install of $MODPACK_VERSION..."
                cp -r "$EXTRACTED_DIR/." /data/
              else
                # Selective update per https://cozystudios.org/homestead/how-to-update-server/
                # Only replace these four folders; world/ and all other data are untouched.
                echo "Updating $INSTALLED_VERSION -> $MODPACK_VERSION..."
                for folder in config mods kubejs scripts; do
                  rm -rf "/data/$folder"
                  if [ -d "$EXTRACTED_DIR/$folder" ]; then
                    cp -r "$EXTRACTED_DIR/$folder" /data/
                  fi
                done
              fi

              rm -rf /tmp/modpack /tmp/modpack.zip
              chown -R 1000:1000 /data
              chmod -R u+w /data
              echo -n "$MODPACK_VERSION" > /data/.modpack-version
              echo "Modpack $MODPACK_VERSION installed successfully."
          volumeMounts:
            - name: data
              mountPath: /data

      containers:
        - name: minecraft
          image: itzg/minecraft-server:java21
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: FABRIC
            - name: VERSION
              value: "1.20.1"
            - name: FABRIC_LOADER_VERSION
              value: "0.18.4"
            - name: MEMORY
              value: "12G"
            - name: JVM_OPTS
              value: >-
                -XX:+UseG1GC
                -XX:+ParallelRefProcEnabled
                -XX:MaxGCPauseMillis=200
                -XX:+UnlockExperimentalVMOptions
                -XX:+DisableExplicitGC
                -XX:+AlwaysPreTouch
                -XX:G1NewSizePercent=30
                -XX:G1MaxNewSizePercent=40
                -XX:G1HeapRegionSize=8M
                -XX:G1ReservePercent=20
                -XX:G1HeapWastePercent=5
                -XX:G1MixedGCCountTarget=4
                -XX:InitiatingHeapOccupancyPercent=15
                -XX:G1MixedGCLiveThresholdPercent=90
                -XX:G1RSetUpdatingPauseTimePercent=5
                -XX:SurvivorRatio=32
                -XX:+PerfDisableSharedMem
                -XX:MaxTenuringThreshold=1
            - name: CF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minecraft-secrets
                  key: CF_API_KEY
            - name: CURSEFORGE_FILES
              value: "distant-horizons:7977106"
            - name: SIMULATION_DISTANCE
              value: "6"
            - name: VIEW_DISTANCE
              value: "6"
          ports:
            - containerPort: 25565
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 12Gi
              cpu: "2"
            limits:
              memory: 14Gi
              cpu: "6"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
