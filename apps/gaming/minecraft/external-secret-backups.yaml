# Garage credentials for the `minecraft-backups` bucket.
#
# Pulls the scoped access key pair from GCP Secret Manager (project
# `homelab-495921` — Minecraft is a homelab-only workload; per the consumer-owns
# rule its secrets live in the homelab project, not `cove-6a685`) and materializes
# them as K8s Secret `minecraft-backups-creds` in the `gaming` namespace.
# The Secret exposes keys under the standard AWS env-var names so the init
# container and the backup CronJob can consume it via `envFrom`.
#
# Bootstrap (one-time, before this lands on the cluster):
#   1. Create the bucket:
#        kubectl -n garage exec garage-0 -- /garage bucket create minecraft-backups
#   2. Create a scoped key and allow it on the bucket:
#        kubectl -n garage exec garage-0 -- /garage key create minecraft-backups
#        kubectl -n garage exec garage-0 -- /garage bucket allow minecraft-backups \
#            --key minecraft-backups --read --write --owner
#      Copy the key ID and secret immediately — not retrievable later.
#   3. Store in GCP SM (no trailing newline):
#        echo -n '<access-key-id>' | gcloud secrets create garage-minecraft-backups-access-key \
#            --project homelab-495921 --data-file=- --replication-policy=automatic
#        echo -n '<secret-key>' | gcloud secrets create garage-minecraft-backups-secret-key \
#            --project homelab-495921 --data-file=- --replication-policy=automatic
#   4. Merge the PR — ESO creates the Secret on its next refresh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
    name: minecraft-backups-creds
    namespace: gaming
spec:
    refreshInterval: 1h
    secretStoreRef:
        kind: ClusterSecretStore
        name: gcp-homelab
    target:
        name: minecraft-backups-creds
        creationPolicy: Owner
    data:
        - secretKey: AWS_ACCESS_KEY_ID
          remoteRef:
              key: garage-minecraft-backups-access-key
        - secretKey: AWS_SECRET_ACCESS_KEY
          remoteRef:
              key: garage-minecraft-backups-secret-key
